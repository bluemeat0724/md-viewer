# dsh-md-viewer bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
#   dsh plugin --profile web add @bluemeat0724/dsh-md-viewer
#   (development: dsh plugin --profile web add link:<repo>/packages/dsh-md-viewer)
- insert:
    - id: md-viewer
      name: '@bluemeat0724/dsh-md-viewer'
