<script>
(function(){try{var t=localStorage.getItem('mdv-theme')||'light';var d=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-book"/></svg></span>
        <span class="brand-name">%%TITLE%%</span>
      </div>
      <button id="sidebar-close" title="收起目录 (⌘/Ctrl+B)" aria-label="收起目录"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
    </div>
    <div class="search-box">
      <svg class="icon search-ico" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="搜索文件名 / 正文… ( / )" autocomplete="off">
      <button id="search-clear" class="search-clear" title="清空搜索" aria-label="清空搜索" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-circle-x"/></svg></button>
    </div>
    <div id="search-count" aria-live="polite"></div>
    <nav id="toc" aria-label="文档目录"></nav>
    <div id="side-foot" class="side-foot"></div>
  </aside>
  <div id="scrim" role="presentation"></div>
  <main id="main">
    <header class="toolbar">
      <button id="sidebar-toggle" class="ibtn" title="目录 (⌘/Ctrl+B)" aria-label="展开目录"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg></button>
      <div class="crumbs"><span class="crumb-root">%%TITLE%%</span><span class="crumb-sep" aria-hidden="true">/</span><span id="crumb-doc">…</span></div>
      <div class="toolbar-actions">
        <button class="tbtn" id="btn-prev" title="上一篇 ( [ )"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-left"/></svg><span class="lbl">上一篇</span></button>
        <button class="tbtn" id="btn-next" title="下一篇 ( ] )"><span class="lbl">下一篇</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-right"/></svg></button>
        <button class="tbtn ibtn" id="btn-theme" title="主题：浅色 / 深色 / 自动" aria-label="切换主题"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-sun"/></svg></button>
        <button class="tbtn ibtn" id="btn-outline" title="本页目录" aria-label="本页目录" aria-expanded="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list"/></svg></button>
        <button class="tbtn ibtn" id="btn-print" title="打印当前文档" aria-label="打印当前文档"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-printer"/></svg></button>
      </div>
    </header>
    <div id="content-wrap">
      <div id="docs">
        <article class="doc" id="doc-content"></article>
      </div>
      <nav id="outline" aria-label="本页目录">
        <div class="outline-title">本页目录</div>
        <div id="outline-list"></div>
      </nav>
      <div id="outline-pop" role="dialog" aria-label="本页目录">
        <div class="outline-title">本页目录</div>
        <div id="outline-pop-list"></div>
      </div>
    </div>
  </main>
</div>
